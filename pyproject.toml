[build-system]
requires = ["setuptools>=78.1.1", "wheel", "Cython==3.1.4"]
build-backend = "setuptools.build_meta"

[project]
name = "h2o-sonar"
version = "3.3.0"
description = "H2O Sonar: Predictive and Generative Machine Learning Interpretability Toolkit"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "H2O.ai", email = "support@h2o.ai"}
]
dynamic = ["scripts"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
]

dependencies = [
  "airium>=0.2.3",
  "cachetools~=5.5.0",
  "cryptography>=46.0.7",
  "datatable",
  "Markdown>=3.2.2",
  "matplotlib>=3.4.3",
  "numpy~=1.26.4",
  "pandas>=1.2.4,<=1.5.3",
  "pydot>=1.4.2",
  "retrying~=1.3.4",
  "setuptools>=78.1.1",
  "toml>=0.10.2",
]

[project.optional-dependencies]
explainers = [
  "daimojo~=2.8.10; platform_system!='Darwin'",  # not supported on macOS
  "graphviz>=0.17",
  "h2o~=3.46.0.9",
  "networkx>=2.8.6",
  "numba>=0.57.0; platform_system!='Darwin'",  # requires LLVM, not available on macOS
  "psutil>=5.8.0",
  "scikit-learn>=1.5.2",
  "scipy>=1.15.2",
  "shap>=0.40.0,<=0.42.5; platform_system!='Darwin'",  # depends on numba
]

evaluators = [
  "anthropic~=0.72.0",  # update also genaiclient dependencies
  "bert-score~=0.3.13",
  "boto3~=1.39.4",  # update also genaiclient dependencies
  "deepdiff~=8.6.2",
  "detoxify~=0.5.2",
  "hf-xet~=1.1.2",
  "httpx~=0.27.2",
  "jsonschema",
  "langchain-community>=0.4",
  "langchain-core>=1.2.11",
  "langchain>=1.0",
  "langchain-openai>=1.0,<1.1.10",  # 1.1.10+ requires openai>=2.x (breaking)
  "langchain-text-splitters>=1.0",
  "lmppl @ https://eval-studio-artifacts.s3.us-east-1.amazonaws.com/dependencies/lmppl/lmppl-0.0.1-py3-none-any.whl",
  "networkx>=2.8.6",
  "nltk~=3.9.3",
  "numba>=0.57.0; platform_system!='Darwin'",  # requires LLVM, not available on macOS
  "openai~=1.109.1",  # update also genaiclient dependencies; 1.109.1 required by langchain-openai>=1.0
  "opensearch-py~=2.7.1",  # update also genaiclient dependencies
  "optimum[onnxruntime-gpu]~=1.17.1",  # supports both CPU and GPU (distro just bigger than [onnxruntime])
  "psutil>=5.8.0",
  "pyarrow~=20.0.0",
  "ragas @ https://eval-studio-artifacts.s3.us-east-1.amazonaws.com/dependencies/ragas/ragas-0.1.7%2Bh2osonar.1-py3-none-any.whl",
  "requests",
  "rouge-score~=0.1.2",
  "scipy>=1.15.2",
  "sentence-transformers~=5.1.2",
  "transformers~=4.53.0",
  "umap-learn~=0.5.9.post2; platform_system!='Darwin'",  # depends on numba, not available on macOS
]

genaiclient = [
  "anthropic~=0.72.0",
  "boto3~=1.39.4",
  "opensearch-py~=2.7.1",
  "openai~=1.109.1",
  "requests",
]

# Combined extras
all = [
  "h2o-sonar[explainers,evaluators]",
]

[project.urls]
"Homepage" = "https://github.com/h2oai/h2o-sonar"
"Bug Tracker" = "https://github.com/h2oai/h2o-sonar/issues"
"Documentation" = "https://h2oai.github.io/h2o-sonar/"

[tool.setuptools]
include-package-data = true

# automatically discover all packages and subpackages
[tool.setuptools.packages.find]
where = ["."]
include = ["h2o_sonar*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.rst", "*.md", "*.json"]

# Development dependency groups (PEP 735)
[dependency-groups]
test = [
  "pytest>=3.1",
  "pytest-cov==2.11.1",
  "pytest-benchmark>=3.1",
  "pytest-ordering>=0.5",
  "pytest-httpserver",
]

style = [
  "ruff==0.9.2",
  "mypy==0.931",
  "pip-audit==2.9.0",
]

docs = [
  "nbsphinx==0.9.5",
  "sphinx-autodoc-typehints==2.4.1",
  "sphinx-rtd-theme==3.1.0",
  "sphinxcontrib-applehelp==2.0.0",
  "sphinxcontrib-devhelp==2.0.0",
  "sphinxcontrib-htmlhelp==2.1.0",
  "sphinxcontrib-jquery==4.1",
  "sphinxcontrib-jsmath==1.0.1",
  "sphinxcontrib-qthelp==2.0.0",
  "sphinxcontrib-serializinghtml==2.0.0",
  "numpydoc==1.8.0",
]

notebooks = [
  "jupyterlab==4.3.5",
  "ipykernel==6.29.5",
  "notebook==7.3.2",
  "ipython==8.18.1",
  "ipywidgets==8.1.5",
]

dev = [
  {include-group = "test"},
  {include-group = "style"},
  {include-group = "docs"},
  {include-group = "notebooks"},
]

# Tool configurations

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  ".eggs",
  "build",
  "dist",
  "__pycache__",
  "*.egg-info",
]

[tool.ruff.lint]
# Enabled rule categories:
# - F: Pyflakes - detects various Python errors (unused imports, undefined names, etc.)
# - E: pycodestyle errors - PEP 8 style violations (line length, whitespace, indentation)
# - W: pycodestyle warnings - PEP 8 style warnings (deprecated features, etc.)
# - I: isort - import statement sorting and organization
# - UP: pyupgrade - modernize Python code (use new syntax features)
# - B: flake8-bugbear - detect likely bugs and design problems
select = ["F", "E", "W", "I", "UP", "B"]

# Ignored rules (with rationale):
# UP038: Use X|Y in isinstance - tuple syntax isinstance(x, (int, str)) is more readable than isinstance(x, int | str)
# B904: Raise with 'from' in except - would require extensive refactoring, bare raise Exception() is acceptable
# B023: Function binds loop variable - many false positives with lambdas like [lambda: x for x in range(10)]
# B007: Unused loop control variable - common pattern for iteration counts like for _ in range(10)
# B024: Abstract class without abstract methods - valid design pattern for interface definitions
# B027: Empty method without abstract decorator - intentional placeholders that child classes optionally override
# UP031: Format specifiers vs percent format - we use f-strings exclusively, catches legacy patterns
# UP013: TypedDict functional to class syntax - functional syntax TypedDict('Name', {...}) is acceptable
# UP012: Unnecessary encode UTF-8 - explicit s.encode('utf-8') is safer for cross-platform compatibility
# B026: Star-arg after keyword argument - intentional pattern in loggers like func(name='x', *args)
ignore = ["UP038", "B904", "B023", "B007", "B024", "B027", "UP031", "UP013", "UP012", "B026"]

[tool.ruff.lint.per-file-ignores]
# Per-file exceptions (with rationale):
# F401: Imported but unused - __init__.py exposes symbols in package namespace (e.g., from .module import Class)
"__init__.py" = ["F401"]
# E402: Module import not at top - Jupyter notebooks often import after markdown cells or path setup
"tests/methods/test_h_statistic.ipynb" = ["E402"]

[tool.ruff.lint.isort]
# Match .isort.cfg configuration
known-first-party = ["h2o_sonar", "tests"]
force-single-line = true
lines-after-imports = 2
order-by-type = false
case-sensitive = false

[tool.pytest.ini_options]
minversion = "3.1"
testpaths = ["tests"]
norecursedirs = ["build", "ci", "docs", ".cache", ".git", ".idea", "venv"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
  "agentic: Testing agents or agentic evaluations.",
  "cli_json_args: CLI JSON arguments test.",
  "cli: CLI test.",
  "documentation: H2O Sonar documentation test.",
  "expensive: Expensive test - preferably not to be run on CI.",
  "flaky: Flaky test - may fail intermittently.",
  "generative: Generative AI tests for LLMs and RAGs.",
  "h2o_model_validation: H2O Model Validation integration test.",
  "h2o_sonar: H2O Sonar library test.",
  "h2ogpte: h2oGPTe test.",
  "slow: mark test as slow running",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
  "build/",
  "dist/",
  ".venv/",
]

[tool.coverage.run]
source = ["h2o_sonar"]
omit = [
  "*/tests/*",
  "*/test_*.py",
  "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]

[tool.uv]
# uv-specific configuration for behavior (not dependencies)
# Development dependencies are defined in [dependency-groups] per PEP 735
# Use: uv sync --group dev  (installs test + style + docs groups)

# Prefer binary distributions where available
index-strategy = "unsafe-best-match"

[tool.uv.sources]
# Note: Private dependencies (H2OGPTE) must be installed separately via deps/ directory
